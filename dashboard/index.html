<style>
@layer base {
  :root {
    /* Primitive palette */
    --ink-950: oklch(0.145 0.018 285);
    --ink-900: oklch(0.19 0.022 285);
    --ink-850: oklch(0.225 0.022 285);
    --ink-800: oklch(0.27 0.025 285);
    --ink-700: oklch(0.36 0.025 285);
    --paper-100: oklch(0.92 0.025 85);
    --paper-200: oklch(0.87 0.03 85);
    --text-100: oklch(0.95 0.008 285);
    --text-300: oklch(0.78 0.015 285);
    --text-500: oklch(0.65 0.018 285);
    --signal-yellow: oklch(0.93 0.12 100);
    --signal-green: oklch(0.77 0.15 155);
    --signal-purple: oklch(0.54 0.16 325);

    /* Semantic tokens */
    --background: var(--ink-950);
    --foreground: var(--text-100);
    --surface: var(--ink-900);
    --surface-raised: var(--ink-850);
    --surface-hover: var(--ink-800);
    --line: var(--ink-700);
    --muted: var(--text-500);
    --accent: var(--signal-yellow);
    --success: var(--signal-green);
    --paper: var(--paper-100);

    /* Component tokens */
    --panel-border: 1px solid color-mix(in oklch, var(--line) 72%, transparent);
    --focus-ring: 0 0 0 2px var(--background), 0 0 0 4px var(--accent);
    --radius: 4px;
    --font-sans: 'IBM Plex Sans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
    --font-mono: 'IBM Plex Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
  }

  :root[data-skin='cyber'] {
    --ink-950: #050708;
    --ink-900: #0a0e10;
    --ink-850: #111719;
    --ink-800: #1b2326;
    --ink-700: #354247;
    --text-100: #e8f1ef;
    --text-300: #a8bcbd;
    --text-500: #789397;
    --signal-yellow: #f4e90f;
    --signal-green: #48e0c2;
    --signal-purple: #00d7e9;
    --cyber-cyan: #00d7e9;
    --cyber-red: #f13245;
    --cyber-yellow: #f4e90f;
    --background: var(--ink-950);
    --foreground: var(--text-100);
    --surface: var(--ink-900);
    --surface-raised: var(--ink-850);
    --surface-hover: var(--ink-800);
    --line: var(--ink-700);
    --muted: var(--text-500);
    --panel-border: 1px solid rgb(241 50 69 / 0.58);
    --focus-ring: 0 0 0 2px #050708, 0 0 0 4px #f4e90f;
    --radius: 0;
  }

  :root[data-skin='soft'] {
    color-scheme: light;

    /* Soft UI primitives: one base color, two opposing light sources. */
    --ink-950: #e6e7ee;
    --ink-900: #e6e7ee;
    --ink-850: #ecf0f3;
    --ink-800: #d1d9e6;
    --ink-700: #b1bcce;
    --paper-100: #e6e7ee;
    --paper-200: #d1d9e6;
    --text-100: #31344b;
    --text-300: #44476a;
    --text-500: #525480;
    --signal-yellow: #2d4cc8;
    --signal-green: #18634b;
    --signal-purple: #6f42c1;

    --panel-border: 1px solid #d1d9e6;
    --focus-ring: 0 0 0 2px #e6e7ee, 0 0 0 4px #2d4cc8;
    --radius: 9px;
    --font-sans: 'Nunito Sans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;

    --neu-bg: #e6e7ee;
    --neu-border: #d1d9e6;
    --neu-shadow: #b8b9be;
    --neu-highlight: #ffffff;
    --neu-raised: 6px 6px 12px #b8b9be, -6px -6px 12px #ffffff;
    --neu-raised-small: 3px 3px 6px #b8b9be, -3px -3px 6px #ffffff;
    --neu-inset: inset 2px 2px 5px #b8b9be, inset -3px -3px 7px #ffffff;
    --neu-inset-small: inset 2px 2px 4px #b8b9be, inset -2px -2px 4px #ffffff;
  }

  :root[data-skin='pottery'] {
    color-scheme: dark;

    /* Attic black-figure pottery: fired clay, dark glaze, ivory and bronze. */
    --ink-950: #170f0b;
    --ink-900: #1d140f;
    --ink-850: #3b221a;
    --ink-800: #4a2b1e;
    --ink-700: #7c604c;
    --paper-100: #ecd8af;
    --paper-200: #e1be9a;
    --text-100: #ecd8af;
    --text-300: #e1be9a;
    --text-500: #b59b77;
    --signal-yellow: #aa3205;
    --signal-green: #95aa88;
    --signal-purple: #859576;

    --background: var(--ink-950);
    --foreground: var(--text-100);
    --surface: var(--ink-900);
    --surface-raised: var(--ink-850);
    --surface-hover: var(--ink-800);
    --line: var(--ink-700);
    --muted: var(--text-500);
    --accent: #d87945;
    --success: var(--signal-green);
    --paper: var(--paper-100);
    --panel-border: 1px solid #7c604c;
    --focus-ring: 0 0 0 2px #170f0b, 0 0 0 4px #e1be9a;
    --radius: 2px;
    --font-display: 'Cinzel', 'Songti SC', 'Noto Serif CJK SC', 'SimSun', serif;

    --pottery-clay: #c8470f;
    --pottery-action: #aa3205;
    --pottery-gold: #b2835e;
    --pottery-olive: #859576;
  }

  * {
    box-sizing: border-box;
    border-color: var(--line);
  }

  html {
    min-width: 320px;
    min-height: 100%;
    color-scheme: dark;
    background: var(--background);
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    min-width: 320px;
    min-height: 100dvh;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.55;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input,
  select,
  textarea {
    color: inherit;
    font: inherit;
  }

  button,
  select {
    cursor: pointer;
  }

  button:disabled {
    cursor: not-allowed;
  }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  a:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }

  ::selection {
    color: var(--ink-950);
    background: var(--accent);
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: var(--surface);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--line);
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<style>#root {
  min-height: 100dvh;
}

.app-shell {
  position: relative;
  min-height: 100dvh;
  overflow: clip;
  background:
    radial-gradient(circle at 84% 0%, oklch(0.3 0.06 325 / 0.18), transparent 32rem),
    var(--background);
}

.app-shell::before {
  position: fixed;
  z-index: 0;
  inset: 0;
  pointer-events: none;
  content: '';
  opacity: 0.12;
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, oklch(0.8 0.02 285 / 0.09) 3px 4px);
}

.topbar,
.workspace-grid,
.app-footer {
  position: relative;
  z-index: 1;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  min-height: 56px;
  padding: 0 12px;
  border-bottom: var(--panel-border);
  background: oklch(0.16 0.02 285 / 0.92);
  backdrop-filter: blur(12px);
}

.project-tabs {
  display: flex;
  max-width: 100%;
  overflow-x: auto;
  align-items: center;
  gap: 2px;
}

.project-tabs button {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 13px;
  gap: 8px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text-300);
  font-size: 13px;
  transition: color 160ms ease-out, background-color 160ms ease-out, border-color 160ms ease-out;
}

.project-tabs button:hover {
  color: var(--foreground);
  background: var(--surface-hover);
}

.project-tabs button.is-active {
  border-bottom-color: var(--accent);
  color: var(--foreground);
  background: var(--surface-raised);
}

.project-tabs button span {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
}

.topbar-status {
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
}

.system-status,
.record-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.system-status svg {
  color: var(--success);
}

.balance b {
  color: var(--text-100);
  font-weight: 500;
}

.record-button,
.text-button {
  min-height: 36px;
  padding: 0 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-300);
  font-size: 12px;
  transition: color 160ms ease-out, border-color 160ms ease-out, background-color 160ms ease-out;
}

.record-button:hover,
.text-button:hover {
  border-color: var(--line);
  background: var(--surface-hover);
  color: var(--foreground);
}

.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}

.task-sidebar {
  display: flex;
  min-width: 0;
  padding: 18px 16px 14px;
  flex-direction: column;
  border-bottom: var(--panel-border);
  background: oklch(0.17 0.018 285 / 0.76);
}

.sidebar-heading,
.section-header,
.task-group-heading,
.station-header,
.station-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-heading {
  margin-bottom: 14px;
}

.sidebar-heading h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.sidebar-heading > span {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
}

.quick-add {
  margin-bottom: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
}

.quick-add-row {
  display: flex;
  align-items: center;
  min-height: 42px;
  padding-left: 10px;
  color: var(--muted);
}

.quick-add input {
  width: 100%;
  min-width: 0;
  padding: 9px 8px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--foreground);
  font-size: 13px;
}

.quick-add input::placeholder {
  color: var(--muted);
}

.quick-add-submit {
  align-self: stretch;
  flex: none;
  padding: 0 10px;
  white-space: nowrap;
  border: 0;
  border-left: 1px solid var(--line);
  background: var(--surface-raised);
  color: var(--accent);
  font-size: 12px;
}

.quick-add-submit:disabled {
  color: var(--muted);
  opacity: 0.45;
}

.quick-add select {
  width: 100%;
  min-height: 32px;
  padding: 0 9px;
  border: 0;
  border-top: 1px solid var(--line);
  outline: 0;
  background: var(--surface);
  color: var(--text-300);
  font-size: 12px;
}

.task-groups {
  display: grid;
  gap: 18px;
}

.task-group {
  min-width: 0;
}

.task-group-heading {
  min-height: 26px;
  margin-bottom: 5px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
}

.task-group-heading h2 {
  margin: 0;
  color: var(--text-300);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
}

.task-row {
  display: grid;
  width: 100%;
  min-height: 46px;
  padding: 7px 3px;
  grid-template-columns: 20px minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  border: 0;
  border-bottom: 1px solid oklch(0.36 0.025 285 / 0.48);
  background: transparent;
  color: var(--text-100);
  text-align: left;
}

button.task-row {
  transition: background-color 160ms ease-out, transform 160ms ease-out;
}

button.task-row:hover {
  background: var(--surface-hover);
}

button.task-row:active {
  transform: translateY(1px);
}

.task-row--approval.is-selected {
  background: oklch(0.93 0.12 100 / 0.08);
}

.task-row-title {
  min-width: 0;
  overflow: hidden;
  font-size: 14px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-row-title small {
  margin-left: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}

.task-row-meta {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  white-space: nowrap;
}

.task-row--approval .task-row-meta {
  color: var(--accent);
  font-family: var(--font-sans);
  font-size: 11px;
}

.approval-marker {
  display: grid;
  width: 19px;
  height: 19px;
  place-items: center;
  background: var(--accent);
  color: var(--ink-950);
  font-size: 10px;
  font-weight: 700;
}

.task-state {
  display: block;
  width: 11px;
  height: 11px;
  margin-left: 3px;
  border: 1px solid var(--muted);
  border-radius: 50%;
}

.task-state--running {
  border-color: var(--success);
  border-top-color: transparent;
  animation: status-spin 2.8s linear infinite;
}

.task-row--waiting {
  color: var(--text-300);
}

.group-empty {
  margin: 8px 0;
  color: var(--muted);
  font-size: 12px;
}

.completed-toggle {
  display: flex;
  min-height: 44px;
  margin-top: 18px;
  padding: 0;
  align-items: center;
  justify-content: space-between;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 12px;
}

.completed-toggle > span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.completed-toggle:hover {
  color: var(--foreground);
}

.completed-list {
  padding: 4px 0 8px;
}

.completed-list > div {
  display: flex;
  padding: 7px 0;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid oklch(0.36 0.025 285 / 0.35);
  color: var(--muted);
  font-size: 12px;
}

.completed-list small {
  font-family: var(--font-mono);
  font-size: 10px;
}

.main-workspace {
  min-width: 0;
  padding: 14px 12px 28px;
}

.agent-workbench {
  min-width: 0;
}

.section-header {
  min-height: 44px;
  margin-bottom: 10px;
  gap: 12px;
}

.section-title-wrap,
.section-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.section-header-actions > span {
  display: none;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
}

.live-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--success);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.live-label i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
  animation: live-pulse 1.6s ease-in-out infinite;
}

.text-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.agent-stations {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  border: var(--panel-border);
  background: var(--line);
  gap: 1px;
}

.agent-station {
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: var(--surface);
}

.agent-station::after {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 34%;
  height: 45%;
  pointer-events: none;
  content: '';
  opacity: 0.07;
  background: repeating-linear-gradient(135deg, var(--agent-color) 0 5px, transparent 5px 10px);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.station-header {
  position: relative;
  z-index: 2;
  min-height: 44px;
  padding: 8px 12px;
  border-bottom: 1px solid oklch(0.36 0.025 285 / 0.55);
}

.station-header > div {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
}

.station-header h3 {
  margin: 0;
  overflow: hidden;
  font-size: 13px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.station-color {
  width: 7px;
  height: 7px;
  flex: none;
  border: 1px solid oklch(0.8 0.02 285 / 0.4);
  border-radius: 50%;
  background: var(--agent-color);
  box-shadow: 0 0 8px color-mix(in oklch, var(--agent-color) 60%, transparent);
}

.status-badge {
  flex: none;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
}

.status-badge--working {
  color: var(--success);
}

.status-badge--paused {
  color: oklch(0.8 0.15 85);
}

.station-stage {
  position: relative;
  z-index: 1;
  display: flex;
  min-height: 166px;
  padding: 12px 12px 4px;
  align-items: flex-end;
  gap: 10px;
}

.bot-pedestal {
  position: relative;
  width: 66px;
  flex: 0 0 66px;
  align-self: center;
}

.pedestal-line {
  display: block;
  width: 42px;
  height: 1px;
  margin: -3px auto 0;
  opacity: 0.6;
}

.agent-bot {
  position: relative;
  width: 100%;
}

.agent-bot svg {
  display: block;
  width: 100%;
  overflow: visible;
}

.agent-bot--small {
  width: 32px;
}

.bot-shadow {
  fill: oklch(0.05 0.01 285 / 0.6);
  transform-box: fill-box;
  transform-origin: center;
  animation: shadow-breathe 2.8s ease-in-out infinite;
}

.bot-float {
  transform-box: fill-box;
  transform-origin: center;
  animation: bot-hover 2.8s ease-in-out infinite;
}

.bot-eyes {
  transform-box: fill-box;
  transform-origin: center;
  animation: bot-blink 5.2s ease-in-out infinite;
}

.agent-bot--paused .bot-float,
.agent-bot--paused .bot-shadow {
  animation-play-state: paused;
}

.agent-bot--paused {
  filter: saturate(0.55);
  opacity: 0.72;
}

.agent-bot--idle .bot-float {
  animation-duration: 4.8s;
}

.agent-bot--idle {
  opacity: 0.72;
}

.bot-status-dot {
  position: absolute;
  right: 7px;
  bottom: 18px;
  width: 6px;
  height: 6px;
  border: 1px solid var(--surface);
  border-radius: 50%;
}

.agent-monitor {
  position: relative;
  min-width: 0;
  padding-bottom: 11px;
  flex: 1;
}

.monitor-topbar {
  display: flex;
  height: 22px;
  padding: 0 7px;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--line);
  border-bottom: 0;
  background: var(--surface-raised);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.monitor-topbar i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--muted);
}

.monitor-topbar i.is-live {
  background: var(--success);
  box-shadow: 0 0 6px var(--success);
}

.monitor-screen {
  height: 103px;
  padding: 8px;
  overflow: hidden;
  border: 1px solid var(--line);
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, oklch(0.8 0.02 285 / 0.025) 3px 4px),
    oklch(0.12 0.018 285);
  box-shadow: inset 0 0 20px oklch(0.05 0.01 285 / 0.7);
}

.monitor-screen > strong {
  display: block;
  overflow: hidden;
  margin-bottom: 7px;
  color: var(--text-100);
  font-size: 12px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.terminal-lines {
  display: flex;
  color: var(--text-300);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.65;
  flex-direction: column;
}

.terminal-lines span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.terminal-cursor {
  width: 5px;
  height: 9px;
  margin-top: 2px;
  background: var(--agent-color);
  animation: cursor-blink 1s steps(2) infinite;
}

.monitor-progress {
  display: flex;
  padding: 6px 1px 0;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9px;
}

.progress-track {
  height: 3px;
  overflow: hidden;
  flex: 1;
  background: var(--surface-hover);
}

.progress-track > span {
  display: block;
  height: 100%;
  transition: width 280ms ease-out;
}

.monitor-stand {
  position: absolute;
  bottom: 3px;
  left: 50%;
  width: 40%;
  height: 5px;
  border-bottom: 2px solid var(--line);
  transform: translateX(-50%);
}

.station-footer {
  position: relative;
  z-index: 2;
  min-height: 38px;
  padding: 4px 8px 4px 12px;
  border-top: 1px solid oklch(0.36 0.025 285 / 0.45);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9px;
}

.station-footer > div {
  display: flex;
  gap: 2px;
}

.icon-button {
  display: inline-grid;
  width: 32px;
  height: 32px;
  padding: 0;
  place-items: center;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  transition: color 150ms ease-out, border-color 150ms ease-out, background-color 150ms ease-out;
}

.icon-button:hover {
  border-color: var(--line);
  background: var(--surface-hover);
  color: var(--foreground);
}

.app-footer {
  display: flex;
  padding: 10px 16px;
  justify-content: space-between;
  border-top: var(--panel-border);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
}

.modal-backdrop {
  position: fixed;
  z-index: 50;
  inset: 0;
  display: grid;
  padding: 16px;
  place-items: center;
  background: oklch(0.08 0.015 285 / 0.78);
  backdrop-filter: blur(8px);
  animation: fade-in 160ms ease-out;
}

.activity-modal {
  width: 100%;
  max-width: 640px;
  max-height: min(720px, calc(100dvh - 32px));
  overflow: auto;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: 0 24px 80px oklch(0.05 0.01 285 / 0.65);
  animation: modal-in 200ms ease-out;
}

.activity-modal > header {
  display: flex;
  padding: 18px 20px;
  align-items: flex-start;
  justify-content: space-between;
  border-bottom: var(--panel-border);
}

.activity-modal > header span {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.activity-modal h2 {
  margin: 3px 0 0;
  font-size: 20px;
}

.activity-list {
  padding: 4px 20px;
}

.activity-item {
  display: grid;
  padding: 16px 0;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  gap: 10px;
  border-bottom: 1px solid oklch(0.36 0.025 285 / 0.5);
}

.activity-icon {
  color: var(--muted);
}

.activity-icon--approval {
  color: var(--success);
}

.activity-item strong {
  font-size: 13px;
}

.activity-item p {
  margin: 4px 0 0;
  color: var(--text-300);
  font-size: 14px;
  line-height: 1.6;
}

.activity-item time {
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
}

.activity-modal > footer {
  display: flex;
  padding: 12px 20px;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
}

.modal-empty {
  padding: 30px 0;
  color: var(--muted);
  text-align: center;
}

.toast {
  position: fixed;
  z-index: 60;
  right: 16px;
  bottom: 16px;
  display: flex;
  max-width: calc(100% - 32px);
  min-height: 44px;
  padding: 10px 16px;
  align-items: center;
  gap: 8px;
  border: 1px solid oklch(0.98 0.08 100);
  background: var(--accent);
  color: var(--ink-950);
  box-shadow: 6px 6px 0 oklch(0.54 0.16 325 / 0.45);
  font-size: 13px;
  font-weight: 600;
  animation: toast-in 200ms ease-out;
}

@keyframes status-spin { to { transform: rotate(360deg); } }
@keyframes live-pulse { 50% { opacity: 0.35; transform: scale(0.8); } }
@keyframes bot-hover { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
@keyframes shadow-breathe { 0%, 100% { opacity: 0.5; transform: scaleX(1); } 50% { opacity: 0.25; transform: scaleX(0.75); } }
@keyframes bot-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(0.08); } }
@keyframes cursor-blink { 50% { opacity: 0; } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes modal-in { from { opacity: 0; transform: scale(0.95) translateY(8px); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(0.95); } }

/* Physical decision surface */
.desk-scene {
  position: relative;
  min-height: 530px;
  margin-top: 18px;
  padding: 26px 12px 44px;
  overflow: hidden;
  border: var(--panel-border);
  background:
    radial-gradient(ellipse at 50% -10%, oklch(0.4 0.06 325 / 0.22), transparent 60%),
    repeating-linear-gradient(90deg, oklch(0.22 0.025 285) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg, oklch(0.22 0.025 285) 0 1px, transparent 1px 72px),
    oklch(0.155 0.022 285);
  box-shadow: inset 0 1px 0 oklch(0.8 0.03 325 / 0.08), inset 0 -30px 50px oklch(0.08 0.015 285 / 0.5);
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
  perspective: 1200px;
}

.desk-scene::before {
  position: absolute;
  top: 0;
  right: 0;
  width: 20px;
  height: 20px;
  content: '';
  background: var(--line);
  clip-path: polygon(0 0, 0 100%, 100% 100%);
}

.desk-grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.22;
  background-image: repeating-linear-gradient(3deg, transparent 0 7px, oklch(0.7 0.03 325 / 0.04) 7px 8px);
}

.desk-inbox {
  position: absolute;
  top: 26px;
  left: 18px;
  display: none;
  width: 76px;
  height: 82px;
  transform: rotate(-7deg);
}

.desk-inbox i {
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  background: var(--surface-raised);
  box-shadow: 4px 5px 0 oklch(0.08 0.015 285 / 0.3);
}

.desk-inbox i:nth-child(2) { transform: translate(5px, 5px); }
.desk-inbox i:nth-child(3) { transform: translate(10px, 10px); background: var(--signal-purple); opacity: 0.35; }

.desk-cup {
  position: absolute;
  right: 22px;
  bottom: 42px;
  display: none;
  width: 66px;
  height: 66px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface-raised);
  box-shadow: 5px 8px 16px oklch(0.05 0.01 285 / 0.45);
}

.desk-cup::before {
  position: absolute;
  inset: 8px;
  border: 1px solid var(--line);
  border-radius: 50%;
  content: '';
  background: oklch(0.12 0.025 60);
}

.desk-cup i {
  position: absolute;
  z-index: -1;
  top: 18px;
  right: -19px;
  width: 25px;
  height: 30px;
  border: 5px solid var(--line);
  border-left: 0;
  border-radius: 0 50% 50% 0;
}

.notebook {
  position: relative;
  z-index: 2;
  display: grid;
  width: 100%;
  max-width: 1060px;
  min-height: 430px;
  margin: 0 auto;
  grid-template-columns: minmax(0, 1fr);
  color: oklch(0.25 0.025 285);
  filter: drop-shadow(0 20px 22px oklch(0.05 0.015 285 / 0.55));
  transform: rotateX(1.5deg) rotateZ(-0.25deg);
  transform-origin: center bottom;
  transition: transform 240ms ease-out, opacity 180ms ease-out;
}

.notebook-page {
  position: relative;
  min-width: 0;
  min-height: 410px;
  padding: 20px 22px 28px;
  background-color: var(--paper);
  background-image: repeating-linear-gradient(0deg, transparent 0 27px, oklch(0.5 0.04 285 / 0.1) 27px 28px);
}

.notebook-page--left {
  border-bottom: 1px solid oklch(0.55 0.03 85);
  background-color: oklch(0.92 0.025 85);
}

.notebook-page--right {
  background-color: oklch(0.875 0.032 85);
}

.notebook-rings {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  display: none;
  width: 22px;
  height: 92%;
  justify-content: space-between;
  transform: translate(-50%, -50%);
  flex-direction: column;
  pointer-events: none;
}

.notebook-rings i {
  display: block;
  width: 22px;
  height: 7px;
  border: 2px solid oklch(0.38 0.02 285);
  border-radius: 6px;
  background: linear-gradient(180deg, oklch(0.75 0.015 285), oklch(0.35 0.015 285));
  box-shadow: 0 2px 2px oklch(0.2 0.02 285 / 0.35);
}

.paper-kicker {
  display: flex;
  margin-bottom: 14px;
  align-items: center;
  justify-content: space-between;
  color: oklch(0.4 0.025 285);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
}

.paper-kicker b {
  font-size: 15px;
  font-weight: 500;
}

.approval-tabs {
  display: grid;
  margin-bottom: 17px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}

.approval-tabs button {
  display: grid;
  min-height: 48px;
  padding: 7px 8px;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
  border: 1px solid oklch(0.6 0.03 85);
  background: oklch(0.96 0.015 85 / 0.4);
  color: oklch(0.3 0.025 285);
  text-align: left;
  transition: transform 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
}

.approval-tabs button:hover {
  border-color: oklch(0.35 0.03 285);
  transform: translateY(-1px);
}

.approval-tabs button.is-active {
  border-color: oklch(0.28 0.025 285);
  background: var(--signal-yellow);
}

.approval-tabs button > span {
  grid-row: 1 / 3;
  font-family: var(--font-mono);
  font-size: 11px;
}

.approval-tabs button strong {
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.approval-tabs button small {
  color: oklch(0.43 0.025 285);
  font-size: 10px;
}

.context-meta {
  display: flex;
  margin-bottom: 13px;
  flex-wrap: wrap;
  gap: 5px;
}

.context-meta span {
  padding: 2px 6px;
  border: 1px solid oklch(0.55 0.03 85);
  color: oklch(0.4 0.025 285);
  font-size: 10px;
}

.context-block {
  margin-bottom: 12px;
}

.context-block h3 {
  margin: 0 0 3px;
  color: oklch(0.45 0.025 285);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
}

.context-block p {
  margin: 0;
  font-size: 16px;
  line-height: 1.55;
}

.context-actions {
  display: flex;
  margin-top: 2px;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.context-blocker {
  display: inline-block;
  padding: 3px 7px;
  background: oklch(0.28 0.025 285);
  color: var(--paper-100);
  font-size: 10px;
}

.undo-inline {
  display: inline-flex;
  min-height: 30px;
  padding: 0 5px;
  align-items: center;
  gap: 4px;
  border: 0;
  background: transparent;
  color: oklch(0.4 0.025 285);
  font-size: 11px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.undo-inline:hover {
  color: oklch(0.2 0.025 285);
}

.page-number {
  position: absolute;
  right: 14px;
  bottom: 7px;
  color: oklch(0.5 0.025 285);
  font-family: var(--font-mono);
  font-size: 9px;
}

.decision-heading {
  display: flex;
  margin-bottom: 8px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: oklch(0.43 0.025 285);
  font-size: 10px;
}

.decision-heading span:first-child {
  padding: 2px 6px;
  background: oklch(0.28 0.025 285);
  color: var(--paper-100);
}

.decision-title {
  position: relative;
  display: inline-block;
  margin: 0 0 14px;
  font-size: 20px;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -0.02em;
}

.decision-title::after {
  position: absolute;
  top: 55%;
  left: -2%;
  width: 104%;
  height: 2px;
  content: '';
  background: oklch(0.35 0.12 155);
  transform: scaleX(0) rotate(-2deg);
  transform-origin: left center;
  transition: transform 420ms ease-out 180ms;
}

.decision-options {
  display: grid;
  gap: 6px;
}

.decision-option {
  position: relative;
  display: grid;
  min-height: 52px;
  padding: 6px 10px;
  grid-template-columns: 18px minmax(0, 1fr) 16px;
  align-items: center;
  gap: 7px;
  border: 1px solid oklch(0.58 0.03 85);
  background: oklch(0.94 0.02 85 / 0.36);
  cursor: pointer;
  transition: border-color 150ms ease-out, background-color 150ms ease-out, transform 150ms ease-out;
}

.decision-option:hover {
  border-color: oklch(0.35 0.03 285);
  transform: translateX(2px);
}

.decision-option:focus-within {
  box-shadow: 0 0 0 2px oklch(0.45 0.12 325 / 0.35);
}

.decision-option.is-selected {
  border-color: oklch(0.3 0.025 285);
  background: oklch(0.93 0.12 100 / 0.45);
}

.decision-option input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.option-index {
  color: oklch(0.45 0.025 285);
  font-family: var(--font-mono);
  font-size: 11px;
}

.option-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
}

.option-copy strong {
  font-size: 13px;
  font-weight: 650;
}

.option-copy strong em {
  margin-left: 6px;
  padding: 1px 4px;
  background: var(--signal-yellow);
  color: oklch(0.28 0.025 285);
  font-size: 9px;
  font-style: normal;
  font-weight: 600;
}

.option-copy small {
  overflow: hidden;
  color: oklch(0.42 0.025 285);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.option-radio {
  width: 13px;
  height: 13px;
  border: 1px solid oklch(0.45 0.03 285);
  border-radius: 50%;
}

.decision-option.is-selected .option-radio {
  border: 4px solid oklch(0.3 0.025 285);
  background: var(--signal-yellow);
}

.agent-recommendation {
  margin: 10px 0 8px;
  color: oklch(0.4 0.025 285);
  font-size: 11px;
  line-height: 1.55;
}

.approval-note {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 7px 9px;
  resize: vertical;
  border: 1px solid oklch(0.58 0.03 85);
  border-radius: 0;
  outline: 0;
  background: oklch(0.94 0.02 85 / 0.42);
  color: oklch(0.28 0.025 285);
  font-size: 12px;
}

.approval-note::placeholder {
  color: oklch(0.48 0.025 285);
}

.decision-actions {
  display: flex;
  margin-top: 9px;
  align-items: center;
  gap: 8px;
}

.approve-button,
.return-button,
.paper-secondary-button {
  display: inline-flex;
  min-height: 42px;
  padding: 0 13px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid oklch(0.28 0.025 285);
  font-size: 12px;
  font-weight: 650;
  transition: transform 150ms ease-out, box-shadow 150ms ease-out, opacity 150ms ease-out;
}

.approve-button {
  flex: 1;
  background: var(--signal-yellow);
  color: oklch(0.22 0.025 285);
  box-shadow: 3px 3px 0 oklch(0.54 0.16 325 / 0.5);
}

.approve-button:hover:not(:disabled) {
  transform: translate(-1px, -1px);
  box-shadow: 5px 5px 0 oklch(0.54 0.16 325 / 0.5);
}

.approve-button:active:not(:disabled) {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 oklch(0.54 0.16 325 / 0.5);
}

.approve-button:disabled {
  opacity: 0.6;
}

.return-button,
.paper-secondary-button {
  background: transparent;
  color: oklch(0.35 0.025 285);
}

.return-button:hover,
.paper-secondary-button:hover {
  background: oklch(0.94 0.02 85 / 0.7);
}

.approval-check {
  position: absolute;
  z-index: 4;
  top: 44%;
  left: 50%;
  display: none;
  width: 180px;
  pointer-events: none;
  transform: translate(-50%, -50%) rotate(-8deg);
}

.approval-check svg {
  display: block;
  width: 100%;
}

.approval-check path {
  fill: none;
  stroke: oklch(0.43 0.13 155);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 230;
  stroke-dashoffset: 230;
}

.approval-check span {
  position: absolute;
  right: -12px;
  bottom: -6px;
  padding: 3px 8px;
  border: 3px solid oklch(0.43 0.13 155);
  color: oklch(0.43 0.13 155);
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.08em;
  opacity: 0;
}

.notebook.is-approving .approval-check {
  display: block;
}

.notebook.is-approving .approval-check path {
  animation: draw-check 560ms ease-out 80ms forwards;
}

.notebook.is-approving .approval-check span {
  animation: stamp-in 180ms ease-out 560ms forwards;
}

.notebook.is-approving .decision-title::after {
  transform: scaleX(1) rotate(-2deg);
}

.notebook.is-approving .decision-options,
.notebook.is-approving .approval-note,
.notebook.is-approving .agent-recommendation {
  opacity: 0.45;
  transition: opacity 200ms ease-out;
}

.notebook.is-returning {
  opacity: 0.55;
  transform: translateX(-8px) rotateX(1.5deg) rotateZ(-0.25deg);
}

.paper-empty {
  display: flex;
  min-height: 300px;
  align-items: center;
  justify-content: center;
  color: oklch(0.42 0.025 285);
  text-align: center;
  flex-direction: column;
}

.paper-empty h2 {
  margin: 10px 0 2px;
  color: oklch(0.28 0.025 285);
  font-size: 21px;
}

.paper-empty p {
  max-width: 30ch;
  margin: 4px 0 18px;
  font-size: 13px;
}

.paper-empty--right {
  min-height: 360px;
}

.empty-check-ring {
  display: grid;
  width: 84px;
  height: 84px;
  place-items: center;
  border: 2px solid oklch(0.43 0.13 155);
  border-radius: 50%;
  color: oklch(0.43 0.13 155);
  transform: rotate(-7deg);
}

.desk-pen {
  position: absolute;
  z-index: 3;
  bottom: 23px;
  left: 50%;
  width: 150px;
  height: 7px;
  border: 1px solid oklch(0.48 0.02 285);
  background: linear-gradient(180deg, oklch(0.42 0.02 285), oklch(0.16 0.02 285));
  box-shadow: 3px 5px 7px oklch(0.05 0.01 285 / 0.45);
  transform: translateX(-50%) rotate(-4deg);
}

.desk-pen::after {
  position: absolute;
  top: -1px;
  right: -13px;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 13px solid oklch(0.65 0.02 285);
  content: '';
}

.desk-pen i {
  position: absolute;
  top: -2px;
  left: 15px;
  width: 3px;
  height: 9px;
  background: var(--signal-purple);
}

.desk-edge {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 10px;
  border-top: 1px solid var(--line);
  background: oklch(0.11 0.02 285);
}

@keyframes draw-check { to { stroke-dashoffset: 0; } }
@keyframes stamp-in { from { opacity: 0; transform: scale(1.35); } to { opacity: 0.85; transform: scale(1); } }

@media (min-width: 560px) {
  .section-header-actions > span { display: inline; }
  .agent-stations { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main-workspace { padding: 16px 18px 30px; }
  .desk-scene { padding: 30px 24px 46px; }
}

@media (min-width: 720px) {
  .topbar { flex-wrap: nowrap; padding: 0 18px; }
  .task-groups { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .notebook { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notebook-rings { display: flex; }
  .notebook-page { padding: 20px 25px 28px; }
  .notebook-page--left { border-right: 1px solid oklch(0.55 0.03 85); border-bottom: 0; }
  .desk-scene { min-height: 500px; }
}

@media (min-width: 1100px) {
  .workspace-grid { grid-template-columns: 280px minmax(0, 1fr); }
  .task-sidebar {
    position: sticky;
    top: 0;
    height: 100dvh;
    overflow-y: auto;
    border-right: var(--panel-border);
    border-bottom: 0;
  }
  .task-groups { display: block; flex: 1; }
  .task-group { margin-bottom: 16px; }
  .main-workspace { padding: 16px 20px 32px; }
  .desk-inbox, .desk-cup { display: block; }
}

@media (min-width: 1280px) {
  .agent-stations { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .station-stage { padding-right: 10px; padding-left: 10px; gap: 7px; }
  .bot-pedestal { width: 58px; flex-basis: 58px; }
  .desk-scene { padding-right: 5%; padding-left: 5%; }
}

@media (min-width: 1500px) {
  .workspace-grid { grid-template-columns: 296px minmax(0, 1fr); }
  .main-workspace { padding: 20px 26px 36px; }
  .bot-pedestal { width: 68px; flex-basis: 68px; }
  .station-stage { gap: 11px; }
  .monitor-screen { height: 110px; }
  .terminal-lines { font-size: 9px; }
}

@media (max-width: 559px) {
  .topbar-status { width: 100%; padding: 4px 0 8px; justify-content: flex-end; }
  .icon-button { width: 44px; height: 44px; }
  .record-button, .text-button, .undo-inline { min-height: 44px; }
  .quick-add-row, .quick-add select { min-height: 44px; }
  .system-status, .balance { display: none; }
  .section-header { align-items: flex-start; }
  .section-header-actions { gap: 4px; }
  .section-header h2 { font-size: 18px; }
  .live-label { display: none; }
  .decision-actions { align-items: stretch; flex-direction: column; }
  .approve-button, .return-button { min-height: 44px; }
  .approval-tabs { grid-template-columns: minmax(0, 1fr); }
  .approval-tabs button { min-height: 52px; }
  .desk-scene { padding-right: 8px; padding-left: 8px; }
  .notebook { transform: none; }
  .notebook-page { padding-right: 16px; padding-left: 16px; }
  .decision-title { font-size: 19px; }
  .desk-pen { width: 110px; }
  .activity-item { grid-template-columns: 22px minmax(0, 1fr); }
  .activity-item time { grid-column: 2; }
  .app-footer { letter-spacing: 0; }
}

/* Skin and notebook comparison controls */
.skin-switch,
.notebook-switch {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
}

.skin-switch button,
.notebook-switch button {
  display: inline-flex;
  min-height: 32px;
  padding: 0 9px;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  transition: color 150ms ease-out, background-color 150ms ease-out;
}

.skin-switch button + button,
.notebook-switch button + button {
  border-left: 1px solid var(--line);
}

.skin-switch button:hover,
.notebook-switch button:hover {
  color: var(--foreground);
  background: var(--surface-hover);
}

.skin-switch button.is-active,
.notebook-switch button.is-active {
  background: var(--accent);
  color: var(--ink-950);
}

.notebook-switch {
  position: absolute;
  z-index: 8;
  top: 13px;
  right: 16px;
}

.notebook-switch > span {
  padding: 0 9px;
  color: var(--muted);
  font-size: 11px;
}

/* Shared dark notebook material */
.notebook {
  --nb-left: oklch(0.235 0.025 300);
  --nb-right: oklch(0.205 0.023 300);
  --nb-text: oklch(0.92 0.012 85);
  --nb-muted: oklch(0.72 0.018 285);
  --nb-faint: oklch(0.58 0.02 285);
  --nb-border: oklch(0.45 0.025 285);
  --nb-rule: oklch(0.72 0.02 285 / 0.12);
  --nb-option: oklch(0.14 0.02 285 / 0.52);
  --nb-accent: var(--signal-yellow);
  --nb-on-accent: oklch(0.2 0.025 85);
  --nb-check: oklch(0.76 0.14 155);
  min-height: 600px;
  color: var(--nb-text);
  border-radius: 2px;
}

.notebook-page {
  min-height: 580px;
  padding: 23px 26px 32px;
  border-color: var(--nb-border);
  background-color: var(--nb-right);
  background-image: repeating-linear-gradient(0deg, transparent 0 29px, var(--nb-rule) 29px 30px);
  color: var(--nb-text);
}

.notebook-page--left {
  background-color: var(--nb-left);
}

.notebook--leather {
  border: 7px solid oklch(0.12 0.018 285);
  box-shadow: inset 0 0 0 1px oklch(0.38 0.025 285 / 0.5), 0 20px 35px oklch(0.05 0.015 285 / 0.5);
}

.notebook--leather .notebook-page {
  background-image:
    radial-gradient(circle at 14% 8%, oklch(0.5 0.04 325 / 0.09), transparent 35%),
    repeating-linear-gradient(0deg, transparent 0 29px, var(--nb-rule) 29px 30px),
    repeating-linear-gradient(97deg, transparent 0 5px, oklch(0.8 0.01 285 / 0.012) 5px 6px);
  box-shadow: inset 0 0 44px oklch(0.08 0.02 285 / 0.25);
}

.notebook--metal {
  --nb-left: oklch(0.27 0.018 250);
  --nb-right: oklch(0.225 0.018 250);
  --nb-text: oklch(0.93 0.008 250);
  --nb-muted: oklch(0.74 0.014 250);
  --nb-faint: oklch(0.6 0.014 250);
  --nb-border: oklch(0.5 0.018 250);
  --nb-rule: oklch(0.75 0.015 250 / 0.09);
  --nb-option: oklch(0.12 0.018 250 / 0.7);
  border: 1px solid oklch(0.55 0.018 250);
  border-radius: 1px;
  box-shadow: 0 0 0 5px oklch(0.12 0.018 250), 0 20px 35px oklch(0.05 0.015 285 / 0.55), inset 0 0 0 1px oklch(0.75 0.015 250 / 0.18);
}

.notebook--metal .notebook-page {
  background-image:
    radial-gradient(circle at 13px 13px, oklch(0.72 0.01 250) 0 2px, oklch(0.2 0.01 250) 2px 4px, transparent 4px),
    radial-gradient(circle at calc(100% - 13px) 13px, oklch(0.72 0.01 250) 0 2px, oklch(0.2 0.01 250) 2px 4px, transparent 4px),
    repeating-linear-gradient(94deg, transparent 0 3px, oklch(0.85 0.01 250 / 0.018) 3px 4px),
    linear-gradient(135deg, oklch(0.4 0.02 250 / 0.08), transparent 40%);
  box-shadow: inset 0 0 34px oklch(0.08 0.02 250 / 0.3);
}

.notebook--metal .notebook-rings {
  width: 20px;
}

.notebook--metal .notebook-rings i {
  width: 20px;
  height: 20px;
  border: 1px solid oklch(0.65 0.015 250);
  border-radius: 1px;
  background: linear-gradient(90deg, oklch(0.24 0.015 250), oklch(0.62 0.015 250) 45%, oklch(0.2 0.015 250) 55%, oklch(0.42 0.015 250));
  box-shadow: 0 2px 3px oklch(0.08 0.015 250 / 0.6);
}

.paper-kicker,
.page-number,
.decision-heading,
.option-index,
.agent-recommendation,
.context-block h3 {
  color: var(--nb-muted);
}

.approval-tabs button {
  border-color: var(--nb-border);
  background: var(--nb-option);
  color: var(--nb-text);
}

.approval-tabs button:hover {
  border-color: var(--nb-accent);
}

.approval-tabs button.is-active {
  border-color: var(--nb-accent);
  background: var(--nb-accent);
  color: var(--nb-on-accent);
}

.approval-tabs button small {
  color: var(--nb-muted);
}

.approval-tabs button.is-active small {
  color: var(--nb-on-accent);
}

.context-meta span {
  border-color: var(--nb-border);
  color: var(--nb-muted);
}

.decision-heading span:first-child {
  background: var(--nb-accent);
  color: var(--nb-on-accent);
}

.decision-title {
  color: var(--nb-text);
  font-size: 22px;
}

.decision-title::after {
  background: var(--nb-check);
}

.decision-context {
  margin: -4px 0 12px;
  border-top: 1px solid var(--nb-rule);
  border-bottom: 1px solid var(--nb-rule);
}

.decision-context summary {
  min-height: 38px;
  padding: 9px 0;
  color: var(--nb-muted);
  font-size: 12px;
  cursor: pointer;
}

.decision-context summary::marker {
  color: var(--nb-accent);
}

.decision-context > div {
  padding: 0 0 10px;
}

.image-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
  margin: 0 0 12px;
}

.image-gallery:has(> a:only-child) {
  grid-template-columns: minmax(0, 1fr);
}

.image-gallery a {
  display: grid;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--nb-border, var(--line));
  background: var(--nb-option, var(--surface-raised));
  color: var(--nb-muted, var(--muted));
  font-size: 11px;
  text-decoration: none;
}

.image-gallery a:hover,
.image-gallery a:focus-visible {
  border-color: var(--nb-accent, var(--accent));
}

.image-gallery img {
  display: block;
  width: 100%;
  max-height: 280px;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background: var(--nb-rule, var(--line));
}

.image-gallery span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.decision-context p {
  margin: 0 0 7px;
  color: var(--nb-muted);
  font-size: 13px;
  line-height: 1.65;
}

.decision-option {
  border-color: var(--nb-border);
  background: var(--nb-option);
  color: var(--nb-text);
}

.decision-option:hover {
  border-color: var(--nb-accent);
}

.decision-option:focus-within {
  box-shadow: 0 0 0 2px color-mix(in oklch, var(--nb-accent) 45%, transparent);
}

.decision-option.is-selected {
  border-color: var(--nb-accent);
  background: color-mix(in oklch, var(--nb-accent) 13%, var(--nb-option));
}

.option-copy small {
  color: var(--nb-muted);
}

.option-copy strong em {
  background: var(--nb-accent);
  color: var(--nb-on-accent);
}

.option-radio {
  border-color: var(--nb-muted);
}

.decision-option.is-selected .option-radio {
  border-color: var(--nb-accent);
  background: var(--nb-accent);
}

.approval-note {
  border-color: var(--nb-border);
  background: var(--nb-option);
  color: var(--nb-text);
}

.approval-note::placeholder {
  color: var(--nb-faint);
}

.return-button,
.paper-secondary-button {
  border-color: var(--nb-border);
  color: var(--nb-text);
}

.return-button:hover,
.paper-secondary-button:hover {
  background: var(--nb-option);
}

.approve-button {
  border-color: var(--nb-accent);
  background: var(--nb-accent);
  color: var(--nb-on-accent);
}

.approval-check path {
  stroke: var(--nb-check);
}

.approval-check span {
  border-color: var(--nb-check);
  color: var(--nb-check);
}

.paper-empty,
.history-empty {
  color: var(--nb-muted);
}

.paper-empty h2,
.history-empty h2 {
  color: var(--nb-text);
}

.empty-check-ring {
  border-color: var(--nb-check);
  color: var(--nb-check);
}

/* Right-page decision history */
.decision-history {
  display: flex;
  max-height: 516px;
  padding-right: 4px;
  overflow-y: auto;
  flex-direction: column;
}

.decision-record {
  padding: 14px 2px 13px;
  border-bottom: 1px solid var(--nb-rule);
  animation: record-in 260ms ease-out both;
}

.decision-record:first-child {
  padding-top: 4px;
}

.decision-record > header,
.decision-record > footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.decision-record > header {
  color: var(--nb-check);
  font-family: var(--font-mono);
  font-size: 10px;
}

.decision-record--returned > header {
  color: var(--nb-accent);
}

.decision-record > header > span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.decision-record time {
  color: var(--nb-faint);
}

.decision-record h3 {
  margin: 7px 0 4px;
  color: var(--nb-text);
  font-size: 17px;
  font-weight: 550;
}

.decision-record--approved h3 {
  color: var(--nb-muted);
  text-decoration: line-through;
  text-decoration-color: var(--nb-check);
  text-decoration-thickness: 1.5px;
}

.decision-record p {
  margin: 0 0 9px;
  color: var(--nb-muted);
  font-size: 12px;
}

.decision-record > footer > span {
  color: var(--nb-faint);
  font-size: 11px;
}

.decision-record > footer button {
  display: inline-flex;
  min-height: 30px;
  padding: 0 4px;
  align-items: center;
  gap: 4px;
  border: 0;
  background: transparent;
  color: var(--nb-muted);
  font-size: 11px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.decision-record > footer button:hover:not(:disabled) {
  color: var(--nb-text);
}

.decision-record > footer button:disabled {
  opacity: 0.4;
}

.history-empty {
  display: flex;
  min-height: 400px;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-direction: column;
}

.history-empty h2 {
  margin: 12px 0 4px;
  font-size: 19px;
}

.history-empty p {
  margin: 0;
  font-size: 13px;
}

@keyframes record-in {
  from { opacity: 0; transform: translateX(-18px) scale(0.96); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

/* Comparison controls sit above, never on top of, the notebook. */
.desk-scene {
  min-height: 704px;
  padding-top: 66px;
}

.notebook-switch {
  top: 16px;
}

.notebook--leather .notebook-rings i {
  border-color: oklch(0.48 0.025 300);
  background: linear-gradient(180deg, oklch(0.68 0.02 300), oklch(0.3 0.02 300));
}

.notebook--metal .decision-record {
  border-bottom-style: dashed;
}

</div>
<footer class="app-footer"><span>LOCAL WORKSPACE</span><span>真实文件看板 · 本机数据</span></footer>
</div>
</div>
<div class="modal-backdrop" id="modalBackdrop" hidden>

</div>
<div class="toast" id="toast" role="status" hidden><svg class="icon"><use href="#i-check"/></svg><span></span></div>
<script>(() => {

function parseHandoff(text) {

function handoffSection(h,needle) {return h?.secs.find(s => s.title.includes(needle))}

function projectCount(pid) {

function renderProjects() {

  let optionHtml='';
  if(kind==='blocked'&&options.length)optionHtml=`<div class="decision-options" role="radiogroup" aria-label="选择方案">${options.map((o,i)=>`<label class="decision-option ${d.option===o.id?'is-selected':''} ${i===0?'is-recommended':''}"><input type="radio" name="option" value="${o.id}" data-draft="option" ${d.option===o.id?'checked':''}><span class="option-index">${i+1}</span><span class="option-copy"><strong>${esc(o.title)}${i===0?'<em>建议</em>':''}</strong><small>${esc(o.description)}</small></span><i class="option-radio"></i></label>`).join('')}</div>`;
  if(kind==='failed')optionHtml=`<div class="decision-options" role="radiogroup" aria-label="处理方式">${[['retry','重新排队','补充说明后，让 Agent 再试两次'],['manual','我手动完成','记录结果与产物，不再交给 Agent']].map(([id,title,desc])=>`<label class="decision-option ${d.option===id?'is-selected':''}"><input type="radio" name="option" value="${id}" data-draft="option" ${d.option===id?'checked':''}><span class="option-index">${id==='retry'?1:2}</span><span class="option-copy"><strong>${title}</strong><small>${desc}</small></span><i class="option-radio"></i></label>`).join('')}</div>`;
  const showExtra=kind==='manual'||(kind==='failed'&&d.option==='manual');
  const extra=showExtra?`<div class="decision-extra"><input value="${esc(d.art)}" data-draft="art" placeholder="产物路径，例如 assets/key_art.png，多个用逗号分隔" aria-label="产物路径"><input value="${esc(d.next)}" data-draft="next" placeholder="下一张卡需要知道的事（可选）" aria-label="下一步"></div>`:'';
  let recommendation='';
  if(kind==='blocked')recommendation=options.length?'推荐方案已标出；也可以选择其他方案并补充说明。':'请在下方写下你的决定，或打开完整交接查看背景。';
  if(kind==='review')recommendation=plainSection(handoffSection(h,'现在能用的')).slice(0,260)||c.goal||'请审阅交接结果，再决定通过或打回。';
  if(kind==='manual')recommendation=c.goal||'填写完成说明，这张卡的交接会留给下一棒。';
  if(kind==='failed')recommendation=c.feedback||`已经尝试 ${c.attempts||0} 次，仍未通过。`;
  const primary=kind==='review'?'审阅通过':kind==='blocked'?`定了，交给 ${agentName(c.agent||c.assignee)}`:kind==='manual'?'标记完成':d.option==='manual'?'确认手动完成':'重新排队';
  const secondary=kind==='review'?'打回重做':kind==='blocked'?'退回补充':'查看交接';
  const placeholder={blocked:'补充说明（可选）；退回补充时请写清楚要改什么',review:'审阅意见；打回时必填',manual:'你做了什么、结果放在哪里',failed:'补充说明（可选）'}[kind];
  $('currentDecision').innerHTML=`<div class="current-decision"><div class="context-meta"><span>${esc(KIND[kind])}</span><span>${esc(p.title)}</span><span>${esc(agentName(c.agent||c.assignee))} 发起</span></div><div class="decision-heading"><span>${heading}</span><span>真实任务 · ${esc(c.id)}</span></div><h2 class="decision-title">${esc(c.title)}</h2>${galleryHtml(p.id,c.images)}<details class="decision-context"><summary>背景与现状</summary><p>${esc(c.goal||'这张卡没有额外目标说明。')}</p>${h===undefined?'<p>正在读取交接…</p>':handoffHtml(h,true)}</details>${optionHtml}<p class="agent-recommendation">${esc(recommendation)}</p><textarea class="approval-note" data-draft="note" rows="2" placeholder="${esc(placeholder)}" aria-label="处理说明">${esc(d.note)}</textarea>${extra}<p class="decision-message" id="decisionMessage"></p><div class="decision-actions"><button type="button" class="approve-button" data-action="decision-primary" data-key="${esc(key)}" ${phase!=='idle'||(kind==='blocked'&&options.length&&!d.option)?'disabled':''}>${ic('check')}${esc(primary)}</button><button type="button" class="return-button" data-action="${kind==='review'?'review-return':kind==='blocked'?'blocked-return':'handoff'}" data-key="${esc(key)}" ${phase!=='idle'?'disabled':''}>${ic(kind==='review'||kind==='blocked'?'return':'file')}${secondary}</button></div><div class="approval-check" aria-hidden="true"><svg viewBox="0 0 180 130"><path d="M20 66 64 105 158 20"/></svg><span>APPROVED</span></div></div>`;
  if(h===undefined&&!handoffRequested.has(key))getHandoff(key);
  restoreFocus();
}
function decisionHistory() {
  const latest=new Map();
  for(const e of events){
    if(e.project==='-'||e.task==='-')continue;
    const key=`${e.project}/${e.task}`,type=e.type;
    if(['review','decision'].includes(type)||(type==='bounce'&&e.agent==='human'))latest.set(key,e);
    else if(type==='done'&&e.agent==='human'){
      const previous=latest.get(key);
      if(!previous||!['review','decision'].includes(previous.type)||e.ts-previous.ts>3)latest.set(key,e);
    }
  }
  return [...latest.entries()].map(([key,e])=>({key,e,t:findTask(key)})).filter(x=>activeProject==='all'||x.e.project===activeProject).sort((a,b)=>b.e.ts-a.e.ts);
}
function renderHistory() {
  const list=decisionHistory();$('historyCount').textContent=String(list.length).padStart(2,'0');
  $('decisionHistory').innerHTML=list.map(({key,e,t})=>{
    const returned=e.type==='bounce',title=t?.c.title||e.task,card=t?.c;
    const detail=e.type==='done'&&e.agent==='human'?'手动完成，结果见交接总结':e.detail||(returned?'已退回补充':'已处理');
    return `<article class="decision-record decision-record--${returned?'returned':'approved'}"><header><span>${ic(returned?'return':'check')}${returned?'已退回':'已批准'}</span><time>${eventTime(e.ts)}</time></header><h3>${esc(title)}</h3><p>${esc(detail)}</p><footer><span>${esc(agentName(card?.agent||card?.assignee||e.to))}</span><div>${card?.status==='done'?`<button type="button" data-action="reopen" data-key="${esc(key)}" title="重开后回到等待队列">${ic('undo')}重开</button>`:''}<button type="button" data-action="handoff" data-key="${esc(key)}">${ic('file')}交接</button></div></footer></article>`;
  }).join('')||`<div class="history-empty">${ic('history')}<h2>还没有决策记录</h2><p>批准、退回或手动完成的事项会保留在这里。</p>`;
}
function showLogs(agent=null) {
  modalType='logs';modalAgent=agent;modalKey=null;lastFocus=document.activeElement;
  $('modalKicker').textContent='WORKSPACE LOG';$('modalTitle').textContent=agent?`${agentName(agent)} · 日志`:'调度记录';
  renderLogs();$('modalBackdrop').hidden=false;$('modalBackdrop').querySelector('[data-action="close-modal"]').focus();
}
function renderLogs() {
  let list=events.filter(e=>!modalAgent||e.agent===modalAgent||e.to===modalAgent);
  if(activeProject!=='all')list=list.filter(e=>e.project===activeProject||e.project==='-');
  list=list.slice(-120).reverse();
  $('modalBody').innerHTML=list.map(e=>{
    const good=['review','decision','done','check_pass'].includes(e.type),kind=e.type==='bounce'?'return':good?'approval':e.type==='handoff'?'handoff':'system';
    return `<article class="activity-item"><span class="activity-icon activity-icon--${kind}">${ic(kind==='approval'?'check':kind==='return'?'undo':kind==='handoff'?'file':'radio')}</span><div><strong>${esc(agentName(e.agent))}</strong><p>${esc(e.task&&e.task!=='-'?e.task+' · ':'')}${esc(e.detail||e.type)}</p><span class="event-type">${esc(e.project==='-'?'调度台':projectTitle(e.project))} · ${esc(e.type)}</span></div><time>${eventTime(e.ts)}</time></article>`;
  }).join('')||'<p class="modal-empty">这个范围当前还没有日志。</p>';
}
function renderHandoffModal(key) {
  const t=findTask(key),h=handoffCache.get(key);if(!t)return;
  modalType='handoff';modalKey=key;modalAgent=null;
  $('modalKicker').textContent=`${t.p.title} / ${t.c.id}`;$('modalTitle').textContent=t.c.title;
  $('modalBody').innerHTML=`<div class="handoff-content">${galleryHtml(t.p.id,t.c.images)}${h===undefined?'<p>正在读取交接…</p>':handoffHtml(h,false)}${h?.meta?.length?`<div class="handoff-meta">${h.meta.map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div>`:''}</div>`;
}
function openHandoff(key) {
  lastFocus=document.activeElement;modalType='handoff';modalKey=key;modalAgent=null;$('modalBackdrop').hidden=false;
  renderHandoffModal(key);$('modalBackdrop').querySelector('[data-action="close-modal"]').focus();getHandoff(key);
}
function closeModal() {$('modalBackdrop').hidden=true;modalType=null;modalAgent=null;modalKey=null;if(lastFocus?.isConnected)lastFocus.focus()}
function decisionError(message) {const el=$('decisionMessage');if(el){el.textContent=message;el.classList.add('is-error')}else toast(message)}
async function runDecision(key,action) {
  const t=findTask(key);if(!t||phase!=='idle')return;
  const {p,c}=t,kind=kindOf(c),d=draftFor(key,kind),options=kind==='blocked'?blockedOptions(handoffCache.get(key)):[];let path='',text=d.note.trim(),ok='已处理';
  if(action==='primary'){
    if(kind==='review'){path='/api/approve';ok='已通过，下一棒接着做'}
    else if(kind==='blocked'){
      const chosen=options.find(o=>o.id===d.option);if(chosen)text=`选 ${Number(chosen.id)+1}：${chosen.full}${d.note.trim()?`\n补充：${d.note.trim()}`:''}`;
      if(!text){decisionError('先选择方案或写下你的决定');return}path='/api/answer';ok='决定已交给 Agent';
    } else if(kind==='manual'||(kind==='failed'&&d.option==='manual')){path='/api/done';ok='已标记完成'}
    else {path='/api/retry';ok='已重新排队'}
  } else if(action==='review-return'||action==='blocked-return'){
    if(!text){decisionError('退回时请写清楚要改什么');return}path='/api/reject';ok='已退回，Agent 会带着你的意见重做';
  } else return;
  phase=kind==='review'&&action==='primary'?'approving':'returning';$('notebook').classList.toggle('is-approving',phase==='approving');$('notebook').classList.toggle('is-returning',phase==='returning');
  document.querySelectorAll('#currentDecision button').forEach(b=>b.disabled=true);
  const body={project:p.id,task:c.id,text};
  if(path==='/api/done'){body.next=d.next;body.artifacts=d.art.split(/[,，]/).map(x=>x.trim()).filter(Boolean)}
  try {
    await post(path,body);toast(ok);delete drafts[key];handoffCache.delete(key);handoffRequested.delete(key);
    if(phase==='approving')await new Promise(resolve=>setTimeout(resolve,720));
    selectedKey=null;await refresh();
  } catch(error){decisionError(error.message);toast(error.message)}
  finally {phase='idle';$('notebook').classList.remove('is-approving','is-returning');renderDecision()}
}
async function reopenTask(key) {
  const t=findTask(key);if(!t||t.c.status!=='done')return;
  if(!window.confirm(`重开「${t.c.title}」？任务会回到等待队列，由 ./wb run 再次派发。`))return;
  try{await post('/api/reject',{project:t.p.id,task:t.c.id,text:'撤销之前的处理结果，重新打开此任务。'});toast('已重开，任务回到等待队列');await refresh()}catch(error){toast(error.message)}
}
async function addTask(event) {
  event.preventDefault();if(adding)return;
  const title=$('newTaskTitle').value.trim(),project=$('newTaskProject').value;if(!title||!project)return;
  adding=true;$('addTaskButton').disabled=true;
  try{await post('/api/add',{project,text:title});$('newTaskTitle').value='';toast('任务已加入等待队列');await refresh()}catch(error){toast(error.message)}finally{adding=false;renderTasks()}
}
async function refresh() {
  try {
    const response=await fetch('/api/state');if(!response.ok)throw new Error('状态读取失败');S=await response.json();
    if(activeProject!=='all'&&!S.projects.some(p=>p.id===activeProject))activeProject='all';
    ensureSelection();renderProjects();renderTasks();renderStations();renderDecision();renderHistory();
  } catch(error){toast(`读取看板失败：${error.message}`)}
}
function refreshSoon(){clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,350)}
function updateConnection() {
  const box=$('systemStatus');box.classList.toggle('is-offline',!connected);box.querySelector('span').textContent=connected?'系统正常':'连接中';
}
$('skinSwitch').addEventListener('click',event=>{const button=event.target.closest('[data-skin]');if(button)setSkin(button.dataset.skin)});
$('quickAdd').addEventListener('submit',addTask);
$('newTaskTitle').addEventListener('input',()=>{$('addTaskButton').disabled=adding||!S.projects.length||!$('newTaskTitle').value.trim()});
$('newTaskProject').addEventListener('change',event=>{quickProject=event.target.value});
$('completedToggle').addEventListener('click',()=>{showDone=!showDone;renderTasks()});
$('modalBackdrop').addEventListener('mousedown',event=>{if(event.target===$('modalBackdrop'))closeModal()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modalType)closeModal()});
document.addEventListener('input',event=>{
  const field=event.target.dataset.draft;if(!field||!selectedKey)return;
  const t=findTask(selectedKey);if(!t)return;const d=draftFor(selectedKey,kindOf(t.c));d[field]=event.target.value;
});
document.addEventListener('change',event=>{
  if(event.target.dataset.draft!=='option'||!selectedKey)return;
  const t=findTask(selectedKey);if(!t)return;draftFor(selectedKey,kindOf(t.c)).option=event.target.value;renderDecision();
});
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const action=button.dataset.action,key=button.dataset.key;
  if(action==='logs')showLogs();
  else if(action==='agent-logs')showLogs(button.dataset.agent);
  else if(action==='close-modal')closeModal();
  else if(action==='handoff'&&key)openHandoff(key);
  else if(action==='refresh')refresh();
  else if(action==='select-decision'&&key){selectedKey=key;renderTasks();renderDecision();getHandoff(key);if(innerWidth<1100)setTimeout(()=>$('decisionDesk').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}),30)}
  else if(action==='decision-primary')runDecision(key,'primary');
  else if(action==='review-return'||action==='blocked-return')runDecision(key,action);
  else if(action==='reopen')reopenTask(key);
});
$('projectTabs').addEventListener('click',event=>{
  const button=event.target.closest('[data-project]');if(!button)return;activeProject=button.dataset.project;selectedKey=null;if(activeProject!=='all')quickProject=activeProject;
  renderProjects();renderTasks();renderDecision();renderHistory();
});
function bootEvents() {
  const source=new EventSource('/api/events'),seen=new Set();
  const signature=e=>`${e.project}/${e.n}/${e.ts}/${e.type}/${e.task}`;
  source.addEventListener('backlog',message=>{events=JSON.parse(message.data);seen.clear();events.forEach(e=>seen.add(signature(e)));renderStations();renderHistory();if(modalType==='logs')renderLogs()});
  source.onmessage=message=>{
    const e=JSON.parse(message.data),sig=signature(e);if(seen.has(sig))return;seen.add(sig);events.push(e);events=events.slice(-500);
    if(seen.size>600)seen.delete(seen.values().next().value);
    if(e.type==='handoff'||['review','decision','bounce','done'].includes(e.type)){const key=`${e.project}/${e.task}`;handoffCache.delete(key);handoffRequested.delete(key);handoffVersion++}
    renderStations();renderHistory();if(modalType==='logs')renderLogs();refreshSoon();
  };
  source.onopen=()=>{connected=true;updateConnection()};source.onerror=()=>{connected=false;updateConnection()};
}
(async function boot(){
  let saved=null;try{saved=localStorage.getItem('agent-skin')||localStorage.getItem('wb-theme')}catch{}
  setSkin(new URLSearchParams(location.search).get('skin')||saved||'night');
  $('clock').textContent=timeNow();setInterval(()=>{$('clock').textContent=timeNow()},30000);setInterval(renderStations,5000);
  updateConnection();await refresh();bootEvents();
})();
})();
</script>
